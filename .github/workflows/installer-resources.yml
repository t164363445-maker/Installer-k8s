name: installer-k8s resources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare collector 1
        shell: python
        run: |
          with open("collector.b64", "x", encoding="ascii") as out:
              out.write("")
      - name: Download and verify resources
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib
          source = gzip.decompress(base64.b64decode(pathlib.Path("collector.b64").read_bytes(), validate=True))
          if hashlib.sha256(source).hexdigest() != "d5726d5d96295947c0cb0ccf9dbe9f9cca38b15e37076e3f0c5da00ca9f0f4bc":
              raise RuntimeError("Collector script digest mismatch")
          pathlib.Path("collect-resources.py").write_bytes(source)
          exec(compile(source, "collect-resources.py", "exec"))
      - name: Upload offline package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-plan-e39e3f45a55377252f3e0962064fbc2c
          path: |
            installer-plan-e39e3f45a55377252f3e0962064fbc2c.tar.gz
            installer-plan-e39e3f45a55377252f3e0962064fbc2c.tar.gz.sha256
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
