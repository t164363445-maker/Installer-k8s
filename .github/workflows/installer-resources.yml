name: installer-k8s resources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare collector 1
        shell: python
        run: |
          with open("collector.b64", "x", encoding="ascii") as out:
              out.write("")
      - name: Download and verify resources
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib
          source = gzip.decompress(base64.b64decode(pathlib.Path("collector.b64").read_bytes(), validate=True))
          if hashlib.sha256(source).hexdigest() != "e2bb205d8d78c7eb77e2b42d4140b0505cf42d2d28b709e2780b377c0308c03c":
              raise RuntimeError("Collector script digest mismatch")
          pathlib.Path("collect-resources.py").write_bytes(source)
          exec(compile(source, "collect-resources.py", "exec"))
      - name: Upload offline package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-plan-2f94d0b9bc7fcf51a150b27080bfe698
          path: |
            installer-plan-2f94d0b9bc7fcf51a150b27080bfe698.tar.gz
            installer-plan-2f94d0b9bc7fcf51a150b27080bfe698.tar.gz.sha256
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
