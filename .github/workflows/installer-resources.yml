name: installer-k8s resources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare collector 1
        shell: python
        run: |
          with open("collector.b64", "x", encoding="ascii") as out:
              out.write("")
      - name: Download and verify resources
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib
          source = gzip.decompress(base64.b64decode(pathlib.Path("collector.b64").read_bytes(), validate=True))
          if hashlib.sha256(source).hexdigest() != "602154183ce5c35d62c2b1163efcc997833acc1d26133e7b9e77e9cedb9a5495":
              raise RuntimeError("Collector script digest mismatch")
          pathlib.Path("collect-resources.py").write_bytes(source)
          exec(compile(source, "collect-resources.py", "exec"))
      - name: Upload offline package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-plan-016f585c22a5ee73c83d9a5b1f2a488b
          path: |
            installer-plan-016f585c22a5ee73c83d9a5b1f2a488b.tar.gz
            installer-plan-016f585c22a5ee73c83d9a5b1f2a488b.tar.gz.sha256
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
